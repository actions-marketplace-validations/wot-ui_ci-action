name: wot-ui-ci-action
description: Upload WeChat, Alipay and DingTalk mini-programs and generate preview QR codes in GitHub Actions
author: wot-ui

branding:
  icon: upload-cloud
  color: blue

inputs:
  command:
    description: Operation to run. One of upload, preview or doctor
    required: false
    default: upload
  platform:
    description: Target platform(s), comma separated. Example weixin,alipay
    required: false
    default: ''
  config:
    description: Optional config file path. Omit to use direct upload inputs or auto-discover project config
    required: false
    default: ''
  project-path:
    description: Built mini-program directory, relative to working-directory. Enables config-free mode
    required: false
    default: ''
  appid:
    description: App ID for the selected platform. Falls back to WEIXIN_APPID, ALIPAY_APPID or DINGTALK_APPID
    required: false
    default: ''
  private-key:
    description: WeChat or Alipay private key text, normally from secrets. Mutually exclusive with private-key-path
    required: false
    default: ''
  private-key-path:
    description: Existing WeChat or Alipay private key file, relative to working-directory
    required: false
    default: ''
  upload-version:
    description: Upload version. Falls back to WOTCI_VERSION, then package.json version
    required: false
    default: ''
  upload-desc:
    description: Upload description. Falls back to WOTCI_DESC, then package.json description
    required: false
    default: ''
  robot:
    description: WeChat CI robot number (1-30). Falls back to WEIXIN_ROBOT, then 1
    required: false
    default: ''
  tool-id:
    description: Alipay open-platform tool ID. Falls back to ALIPAY_TOOL_ID
    required: false
    default: ''
  token:
    description: DingTalk API token, normally from secrets. Falls back to DINGTALK_TOKEN
    required: false
    default: ''
  setting:
    description: WeChat compiler settings as a JSON object (e.g. {"minifyJS":true}). Falls back to WEIXIN_SETTING
    required: false
    default: ''
  preview:
    description: Platform preview configuration as a JSON object. Falls back to WEIXIN_PREVIEW or ALIPAY_PREVIEW
    required: false
    default: ''
  platform-options:
    description: Optional platform configuration as a JSON object, excluding credentials and projectPath. Falls back to WEIXIN_OPTIONS, ALIPAY_OPTIONS or DINGTALK_OPTIONS
    required: false
    default: ''
  working-directory:
    description: Directory to run the CLI in
    required: false
    default: .
  summary:
    description: Markdown result file for upload or preview, relative to working-directory. Publish it to the job summary in a following step
    required: false
    default: ''
  qrcode-output:
    description: Preview QR code file path, relative to working-directory. Only valid for command preview
    required: false
    default: ''
  json-output:
    description: Save CLI JSON stdout to this file (relative to working-directory). Enables JSON output and preserves CLI failures
    required: false
    default: ''
  dry-run:
    description: Validate config without calling SDK
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Prepare CLI cache
      id: wotci-cache-config
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: node "${{ github.action_path }}/scripts/github-action-cache.mjs"

    - name: Restore CLI cache
      id: wotci-cache
      if: ${{ steps.wotci-cache-config.outputs.enabled == 'true' }}
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ${{ steps.wotci-cache-config.outputs.path }}/_cacache
          ${{ steps.wotci-cache-config.outputs.path }}/_npx
        key: ${{ steps.wotci-cache-config.outputs.key }}

    - name: Run wot-ui-ci
      id: wotci-run
      shell: bash
      env:
        WOTCI_INPUTS_JSON: ${{ toJSON(inputs) }}
        INPUT_QRCODE_OUTPUT: ${{ inputs.qrcode-output }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PROJECT_PATH: ${{ inputs.project-path }}
        INPUT_APPID: ${{ inputs.appid }}
        INPUT_PRIVATE_KEY: ${{ inputs.private-key }}
        INPUT_PRIVATE_KEY_PATH: ${{ inputs.private-key-path }}
        INPUT_UPLOAD_VERSION: ${{ inputs.upload-version }}
        INPUT_UPLOAD_DESC: ${{ inputs.upload-desc }}
        INPUT_ROBOT: ${{ inputs.robot }}
        INPUT_TOOL_ID: ${{ inputs.tool-id }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_SETTING: ${{ inputs.setting }}
        INPUT_PREVIEW: ${{ inputs.preview }}
        INPUT_PLATFORM_OPTIONS: ${{ inputs.platform-options }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_JSON_OUTPUT: ${{ inputs.json-output }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        WOTCI_NPM_CACHE: ${{ steps.wotci-cache-config.outputs.path }}
      run: bash "${{ github.action_path }}/scripts/github-action.sh"

    - name: Save CLI cache
      if: ${{ always() && !cancelled() && steps.wotci-run.outputs.cli-cache-ready == 'true' && steps.wotci-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: |
          ${{ steps.wotci-cache-config.outputs.path }}/_cacache
          ${{ steps.wotci-cache-config.outputs.path }}/_npx
        key: ${{ steps.wotci-cache-config.outputs.key }}
